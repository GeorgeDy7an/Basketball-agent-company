 inbox:'Inbox',pending:'Action needed',noticeTag:'Notice',report:'Scouting report delivered',reportText:'A young wing is ready for evaluation.',demand:'A player wants career guidance',demandText:'Luan wants a more consistent role on court.',financeMail:'Financial update',financeText:'Client commissions have arrived this week.',open:'Open scouting report',respond:'Discuss and record',done:'Completed',received:'The conversation is recorded and player trust increases.',overview:'This week',overviewText:'Resolve outstanding decisions before advancing. Routine notices do not require a decision.',advance:'Advance one week',advanced:'Week completed: a new training update is available.',scout:'Prospect',scoutText:'Wing · Age 19 · Ability 68',potential:'Scout assessment',ceiling:'Best case',floor:'Conservative case',best:'League star',worst:'Reliable rotation',style:'Two-way wing',note:'This is a scouting range, not a promise. Minutes, training, and injuries affect development.',more:'Assessment factors',factors:'Based on age, game sample, and scouting observations. More evidence may narrow the range.',view:'View player profile',profile:'Luan · Two-way wing',profileText:'Strong perimeter defense and transition play; outside shooting consistency needs work.',offerA:'Bay Hawks',offerB:'Forest Flyers',salary:'Salary',role:'Role',years:'Length',starter:'Starter',rotation:'Rotation',yr:'2 years',yr3:'3 years',development:'Development',faster:'Faster',stable:'Steady',offerAText:'Lower salary, more minutes and development opportunity.',offerBText:'Higher salary, a rotation role and stronger competition.',choose:'Select offer',selected:'Selected: ',offerNote:'Illustrative offers; selection does not start a real negotiation.',draft:'Until draft',weeks:'4 weeks',combine:'Combine',combineText:'Free to attend. Performance can improve or lower team interest.',workout:'Team workout',workoutText:'Review team interest, workout cost and decision factors.',draftAction:'Reveal sample pick',draftDone:'Pick 18',draftTeam:'Bay Hawks select Luan',draftNote:'This is a fixed sample. The game presents picks in sequence with skip options.',prep:'Preparation details',prepDetail:'Eligibility, workouts, team needs and projected development shape the career path. Undrafted players have other opportunities.',training:'Individual training',trainingText:'Choose an intensity to update the budget and development outlook.',saving:'Economy',normal:'Standard',intense:'Intensive',cost:'Weekly cost',focus:'Focus training',focusText:'Focus training adds investment and raises the growth opportunity.',toggleFocus:'Toggle focus training',on:'Enabled',off:'Disabled',growth:'Development outlook',growthLow:'May improve slightly',growthMid:'May improve significantly',growthHigh:'May improve substantially',trainingNote:'A qualitative assessment, not a guarantee or disclosure of hidden potential.',income:'Weekly income',expenses:'Weekly expenses',net:'Net cash change',commission:'Player commissions',trainingFee:'Training',operations:'Operations',statement:'View expense breakdown',statementText:'Group commissions, training and operating costs by category to keep the important numbers clear.',reset:'Reset demo'}};
const params=new URLSearchParams(location.search),sceneNames=['inbox','scout','negotiation','draft','training','finance'];let language=params.get('lang')==='en'?'en':'zh',tab=Math.max(0,sceneNames.indexOf(params.get('scene'))),state={responded:false,advanced:false,profile:false,offer:'',draft:false,training:1,focus:false};const $=id=>document.getElementById(id),t=k=>data[language][k],fmt=n=>'$'+n.toLocaleString('en-US'),playerName=()=>language==='zh'?'洛安':'Luan';
const button=(label,action,primary=false,disabled=false)=>`<button type="button" class="btn${primary?' primary':''}" data-action="${action}"${disabled?' disabled':''}>${label}</button>`;
const badge=(text,kind='')=>`<span class="tag ${kind}">${text}</span>`;
const facts=items=>`<div class="facts">${items.map(([a,b])=>`<div class="fact"><small>${a}</small><strong>${b}</strong></div>`).join('')}</div>`;
const card=(title,body,extra='',wide=false)=>`<article class="card${wide?' wide':''}"><div class="line"><h3>${title}</h3>${extra}</div>${body}</article>`;
function scene(){
 if(tab===0)return `<div class="grid">${card(t('inbox'),`<p><strong>${t('report')}</strong> · ${t('reportText')}</p><div class="actions">${button(t('open'),'scout',true)}</div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><p><strong>${t('demand')}</strong> · ${t('demandText')}</p>${state.responded?`<div class="receipt">${t('received')}</div>`:`<div class="actions">${button(t('respond'),'respond')}</div>`}<p><strong>${t('financeMail')}</strong> · ${t('financeText')}</p>`,badge(state.responded?t('done'):t('pending'),state.responded?'good':''))}${card(t('overview'),`<p>${t('overviewText')}</p>${state.advanced?`<div class="receipt">${t('advanced')}</div>`:`<div class="actions">${button(t('advance'),'advance',true,!state.responded)}</div>`}`,badge('12','neutral'))}</div>`;
 if(tab===1)return `<div class="grid">${card(playerName(),`<p>${t('scoutText')} · <strong>${t('style')}</strong></p>${facts([[t('ceiling'),t('best')],[t('floor'),t('worst')],[t('potential'),'◈']])}<div class="hint">${t('note')}</div><details><summary>${t('more')}</summary><p>${t('factors')}</p></details><div class="actions">${button(t('view'),'profile',true)}</div>`,badge(t('potential'),'dark'))}${card(t('profile'),state.profile?`<p>${t('profileText')}</p>${facts([[language==='zh'?'位置':'Position','SF'],[t('growth'),t('best')],[t('salary'),'—']])}`:`<p>${t('view')} · ${t('note')}</p>`,badge('SF','neutral'))}</div>`;
 if(tab===2)return `<div class="grid">${[[t('offerA'),'$1.2M',t('starter'),t('yr'),t('offerAText'),'A'],[t('offerB'),'$1.7M',t('rotation'),t('yr3'),t('offerBText'),'B']].map(([team,salary,role,years,desc,key])=>card(team,`<p>${desc}</p>${facts([[t('salary'),salary],[t('role'),role],[t('years'),years]])}<div class="actions">${button(t('choose'),'offer'+key,true)}</div>${state.offer===key?`<div class="receipt">${t('selected')}${team}</div>`:''}`,badge(key==='A'?t('faster'):t('stable'),'dark'))).join('')}</div><div class="hint">${t('offerNote')}</div>`;
 if(tab===3)return `<div class="stage"><div class="pick"><small>${t('draft')}</small><strong>${state.draft?t('draftDone'):t('weeks')}</strong><span>${state.draft?t('draftTeam'):t('draftNote')}</span><div class="actions">${button(t('draftAction'),'draft',true,state.draft)}</div></div>${card(t('combine'),`<p>${t('combineText')}</p><h3 style="margin-top:17px">${t('workout')}</h3><p>${t('workoutText')}</p><details><summary>${t('prep')}</summary><p>${t('prepDetail')}</p></details>`,badge('DRAFT','dark'))}</div>`;
 if(tab===4){const modes=[t('saving'),t('normal'),t('intense')],prices=[0,50,100],total=prices[state.training]+(state.focus?150:0);return `<div class="grid">${card(playerName(),`<p>${t('trainingText')}</p>${facts([[t('cost'),fmt(total)],[t('focus'),state.focus?t('on'):t('off')],[t('growth'),[t('growthLow'),t('growthMid'),t('growthHigh')][state.training]]])}<div class="actions">${modes.map((m,i)=>button(m,'train'+i,state.training===i)).join('')}</div><div class="actions">${button(t('toggleFocus'),'focus')}</div><div class="hint">${t('trainingNote')}</div>`,badge(t('training'),'dark'))}${card(t('focus'),`<p>${t('focusText')}</p>${facts([[t('focus'),state.focus?t('on'):t('off')],[t('cost'),fmt(total)],[t('role'),t('style')]])}`,badge(state.focus?t('on'):t('off'),state.focus?'good':'neutral'))}</div>`;}
 return `<div class="grid">${card(t('net'),`<div class="money">+$2,400</div>${facts([[t('income'),'$8,100'],[t('expenses'),'$5,700'],[t('commission'),'$8,100']])}<div class="meter" aria-hidden="true"><i style="height:36%"></i><i style="height:54%"></i><i style="height:43%"></i><i style="height:70%"></i><i style="height:92%"></i></div><details><summary>${t('statement')}</summary><p>${t('statementText')}</p></details>`,badge(t('done'),'good'),true)}</div>`;
}
function render(){document.documentElement.lang=language==='zh'?'zh-CN':'en';document.title=language==='zh'?'篮球经纪公司 · 系统展示':'Basketball Agency · System Showcase';$('nav').setAttribute('aria-label',language==='zh'?'功能展示':'Showcase navigation');$('lang').textContent=language==='zh'?'English':'中文';$('lang').setAttribute('aria-label',language==='zh'?'Switch to English':'切换为中文');$('title').textContent=t('title');$('subtitle').textContent=t('subtitle');$('notice').textContent=t('notice');$('foot').textContent=t('foot');$('status').innerHTML=[[t('week'),state.advanced?(language==='zh'?'第 13 周':'Week 13'):t('weekValue')],[t('money'),fmt(150000)],[t('clients'),t('people')]].map(([a,b])=>`<div class="stat"><small>${a}</small><strong>${b}</strong></div>`).join('');$('nav').innerHTML=t('tabs').map((v,i)=>`<button type="button" class="tab" data-tab="${i}"${i===tab?' aria-current="page"':''}>${v}</button>`).join('');$('scene').innerHTML=`<header class="header"><div><h2>${t('section')[tab][0]}</h2><p>${t('section')[tab][1]}</p></div></header>${scene()}<div class="actions">${button(t('reset'),'reset')}</div>`;}
$('lang').addEventListener('click',()=>{language=language==='zh'?'en':'zh';render()});$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=Number(b.dataset.tab);render()});$('scene').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='scout')tab=1;else if(a==='respond')state.responded=true;else if(a==='advance'&&state.responded)state.advanced=true;else if(a==='profile')state.profile=true;else if(a==='offerA'||a==='offerB')state.offer=a.slice(-1);else if(a==='draft')state.draft=true;else if(/^train[0-2]$/.test(a))state.training=Number(a.slice(-1));else if(a==='focus')state.focus=!state.focus;else if(a==='reset'){tab=0;state={responded:false,advanced:false,profile:false,offer:'',draft:false,training:1,focus:false}}render()});render();
})();
</script></body></html>
