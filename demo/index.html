<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>经纪人办公室 · 互动演示</title>
  <style>
    :root{--ink:#17283b;--muted:#5a6b7b;--line:#d9e1e8;--paper:#fff;--ground:#eef2f5;--navy:#10263a;--orange:#d95e24;--green:#16744e;--gold:#926600;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;color:var(--ink);background:var(--ground)}
    *{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #265d97;outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.5}.shell{max-width:1100px;margin:auto;min-height:100vh}.mast{padding:26px clamp(20px,4vw,42px) 24px;background:var(--navy);color:#fff}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}.mark{font-size:13px;letter-spacing:.08em;font-weight:700}.lang{border:1px solid #8da0af;background:transparent;color:white;border-radius:7px;padding:8px 12px;min-height:44px}.mast h1{font-size:clamp(26px,4vw,36px);letter-spacing:-.03em;line-height:1.2;margin:22px 0 7px}.mast p{margin:0;color:#c4d1db;font-size:14px;line-height:1.55}.stats{display:flex;gap:28px;flex-wrap:wrap;border-top:1px solid #526475;margin-top:22px;padding-top:15px}.stat small{display:block;font-size:12px;color:#b6c6d3}.stat strong{display:block;margin-top:5px;font-size:18px}.workspace{padding:22px clamp(16px,4vw,42px) 36px}.demo-note{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.6}.columns{display:grid;grid-template-columns:minmax(260px,.8fr) minmax(340px,1.2fr);gap:16px;align-items:start}.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}.panel-heading{padding:20px 20px 16px;display:flex;justify-content:space-between;align-items:end;gap:12px;border-bottom:1px solid var(--line)}h2{font-size:19px;margin:0}.count{color:var(--muted);font-size:13px}.message-list{display:grid}.message{background:white;border:0;text-align:left;padding:17px 20px;border-bottom:1px solid #e8edf1;position:relative;color:inherit}.message:last-child{border-bottom:0}.message:hover,.message.selected{background:#f2f6f9}.message.selected:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--orange)}.message-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.message strong{font-size:14px}.message .subject{display:block;margin-top:8px;font-size:16px;font-weight:700;line-height:1.4}.message .preview{display:block;margin-top:5px;font-size:13px;color:var(--muted);line-height:1.45}.badge{font-size:11px;white-space:nowrap;border-radius:5px;padding:4px 7px;background:#fff1dd;color:#7a5100;font-weight:700}.badge.done{background:#e9f5ee;color:#126443}.badge.info{background:#eef2f5;color:#506170}.detail{padding:24px}.back{display:none;border:0;background:transparent;padding:6px 0 14px;color:#365a72;min-height:44px}.sender{font-size:13px;color:var(--muted);margin:0 0 8px}.detail h2{font-size:24px;line-height:1.3;letter-spacing:-.02em}.lead{margin:14px 0 20px;color:#405466;line-height:1.7;font-size:15px}.factline{display:grid;grid-template-columns:repeat(3,1fr);background:#f2f6f8;border-radius:10px;padding:14px;gap:10px}.factline small{display:block;font-size:12px;color:#526577}.factline strong{display:block;margin-top:5px;font-size:15px}.choice-head{font-size:15px;margin:24px 0 10px}.choice{display:block;width:100%;text-align:left;border:1px solid #ccd8e1;border-radius:9px;background:#fff;padding:14px 16px;color:var(--ink);margin-top:9px;min-height:52px}.choice:hover{border-color:#d95e24}.choice strong{display:block}.choice small{display:block;margin-top:5px;line-height:1.45;color:#526577}.choice.primary{border-color:#d95e24;background:#fff8f3}.receipt{background:#eaf6ef;border-left:3px solid var(--green);border-radius:5px;padding:14px 16px;line-height:1.55;color:#155b3b}.footer{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-top:16px}.footer p{color:var(--muted);font-size:13px;line-height:1.4;margin:0}.advance{background:var(--orange);border:0;border-radius:9px;color:white;font-weight:700;min-height:48px;padding:0 18px;white-space:nowrap}.advance:hover:not(:disabled){background:#b94815}.reset{background:transparent;border:0;color:#4c6275;min-height:44px;padding:0;text-decoration:underline}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:650px){.mast{padding:20px 20px 22px}.mast h1{margin-top:19px}.stats{gap:22px}.workspace{padding:16px 14px 30px}.columns{grid-template-columns:1fr}.detail-panel{display:none}.shell.show-detail .inbox-panel{display:none}.shell.show-detail .detail-panel{display:block}.back{display:block}.detail{padding:18px}.detail h2{font-size:22px}.footer{align-items:flex-start}.footer p{max-width:55%}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="shell" id="app">
    <header class="mast">
      <div class="topline"><span class="mark">THE AGENT'S DESK</span><button class="lang" type="button" id="language" aria-label="Switch language">English</button></div>
      <h1 id="title"></h1><p id="subtitle"></p>
      <div class="stats" aria-label="Office overview"><div class="stat"><small id="weekLabel"></small><strong id="week"></strong></div><div class="stat"><small id="cashLabel"></small><strong id="cash"></strong></div><div class="stat"><small id="taskLabel"></small><strong id="task"></strong></div></div>
    </header>
    <main class="workspace">
      <p class="demo-note" id="note"></p>
      <div class="columns">
        <section class="panel inbox-panel" aria-labelledby="inboxTitle"><div class="panel-heading"><h2 id="inboxTitle"></h2><span class="count" id="count"></span></div><div id="messages" class="message-list"></div></section>
        <section class="panel detail-panel" aria-labelledby="detailTitle"><div class="detail" id="detail"></div></section>
      </div>
      <div class="footer"><div><p id="footerHint"></p><button class="reset" type="button" id="reset"></button></div><button type="button" class="advance" id="advance"></button></div>
    </main>
    <div class="sr-only" role="status" aria-live="polite" id="announcement"></div>
  </div>
  <script>
  (()=>{
    'use strict';
    const words={zh:{title:'经纪人办公室',subtitle:'每个决定，都为球员打开新的可能。',note:'独立互动演示：以下人物、球队及数据均为虚构，展示邮件决策流程。',week:'当前进度',cash:'公司资金',task:'待处理',weekValue:'第 {n} 周',taskValue:'{n} 项',inbox:'收件箱',count:'{n} 封消息',waiting:'待决定',complete:'已完成',notice:'通知',back:'← 返回收件箱',actions:'选择处理方式',price:'服务费用',trust:'球员信任',time:'处理期限',cashValue:'{n} 美元',trustValue:'{n} / 100',deadline:'本周',pay:'安排专项训练',payDetail:'支付 2,000 美元，球员信任 +4。',wait:'暂不安排',waitDetail:'不产生费用，维持现有训练计划。',paid:'已安排专项训练：支出 2,000 美元，球员信任提升 4 点。',declined:'已保留现有训练计划，本次没有费用。',hintPending:'请先处理待决定的邮件。',hintReady:'本周事项已处理，可以继续。',advance:'推进一周',advanced:'已推进至下一周。',reset:'重新体验',result:'处理结果',newMail:'新的消息',nextHint:'本次演示已到结尾，可以重新体验。',nextSubject:'训练观察已送达',nextPreview:'教练团队提交了本周简报。',nextLead:'本周训练顺利完成。这个演示只展示邮件流转，不模拟完整生涯。',nextFact:'本周观察',nextFactValue:'已记录',nextLabel:'反馈状态',nextLabelValue:'已送达',sender:'球员发展团队',subject:'为林昊安排专项训练？',preview:'一项培养机会，需要你决定。',lead:'球员希望增加专项训练。你可以投入一笔费用提高信任，也可以维持当前计划。',newsSender:'球探部门',newsSubject:'新秀观察简报',newsPreview:'本周观察到一位有潜力的年轻球员。',newsLead:'一位年轻后卫在最近的观察中展现了良好的组织能力。后续表现仍需持续观察。',newsA:'球员类型',newsAV:'组织后卫',newsB:'球探评价',newsBV:'值得关注',newsC:'信息状态',newsCV:'初步观察',financeSender:'财务部门',financeSubject:'本周收支摘要',financePreview:'公司经营资金保持稳定。',financeLead:'本周常规收支已经记录。公司仍有足够资金处理当前事项。',financeA:'经营状态',financeAV:'稳定',financeB:'结算周期',financeBV:'每周',financeC:'下一步',financeCV:'查看待办'},en:{title:'The agent’s office',subtitle:'Every decision opens a new path for a player.',note:'Standalone interactive demo. All people, teams and data are fictional.',week:'Progress',cash:'Agency cash',task:'Decisions',weekValue:'Week {n}',taskValue:'{n} pending',inbox:'Inbox',count:'{n} messages',waiting:'Decision',complete:'Completed',notice:'Update',back:'← Back to inbox',actions:'Choose a response',price:'Service cost',trust:'Player trust',time:'Deadline',cashValue:'${n}',trustValue:'{n} / 100',deadline:'This week',pay:'Arrange individual training',payDetail:'Spend $2,000 and increase player trust by 4.',wait:'Keep the current plan',waitDetail:'No cost; continue the existing training plan.',paid:'Individual training arranged. $2,000 spent; player trust increased by 4.',declined:'The existing training plan remains in place. No fee was charged.',hintPending:'Resolve the pending decision first.',hintReady:'This week’s decisions are complete.',advance:'Advance one week',advanced:'Advanced to the next week.',reset:'Start over',result:'Outcome',newMail:'New message',nextHint:'This demo is complete. Start over to try another choice.',nextSubject:'Training report received',nextPreview:'The coaching team sent a weekly report.',nextLead:'Training went smoothly this week. This sample demonstrates inbox decisions rather than a complete career.',nextFact:'Weekly observation',nextFactValue:'Recorded',nextLabel:'Report status',nextLabelValue:'Delivered',sender:'Player development',subject:'Arrange training for Lin Hao?',preview:'A development opportunity needs your decision.',lead:'The player would like additional individual training. You can invest to improve trust or keep the current plan.',newsSender:'Scouting team',newsSubject:'Prospect observation',newsPreview:'A young player stood out this week.',newsLead:'A young guard showed promising playmaking during the latest observation. Further evaluation is needed.',newsA:'Player style',newsAV:'Playmaking guard',newsB:'Scouting view',newsBV:'Worth watching',newsC:'Information',newsCV:'Early assessment',financeSender:'Finance team',financeSubject:'Weekly finances',financePreview:'The agency’s finances remain stable.',financeLead:'This week’s regular income and expenses have been recorded. The agency can afford the current decision.',financeA:'Business health',financeAV:'Stable',financeB:'Settlement',financeBV:'Weekly',financeC:'Next step',financeCV:'Review tasks'}};
    let language='zh', selected='training', decision=null, week=1, balance=150000, trust=72, advanced=false;
    const $=id=>document.getElementById(id), t=k=>words[language][k], format=(s,n)=>s.replace('{n}',n), escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const list=()=>[{id:'training',sender:t('sender'),subject:t('subject'),preview:t('preview'),state:decision?'complete':'waiting'}, {id:'scout',sender:t('newsSender'),subject:t('newsSubject'),preview:t('newsPreview'),state:'notice'},{id:'finance',sender:t('financeSender'),subject:t('financeSubject'),preview:t('financePreview'),state:'notice'},...(advanced?[{id:'followup',sender:t('sender'),subject:t('nextSubject'),preview:t('nextPreview'),state:'notice'}]:[])];
    function facts(entries){return '<div class="factline">'+entries.map(([label,value])=>`<div><small>${escapeHtml(label)}</small><strong>${escapeHtml(value)}</strong></div>`).join('')+'</div>';}
    function render(){
      document.documentElement.lang=language==='zh'?'zh-CN':'en';$('language').textContent=language==='zh'?'English':'中文';$('language').setAttribute('aria-label',language==='zh'?'Switch language to English':'切换至中文');
      for(const [id,key] of [['title','title'],['subtitle','subtitle'],['note','note'],['weekLabel','week'],['cashLabel','cash'],['taskLabel','task'],['inboxTitle','inbox'],['reset','reset'],['advance','advance']])$(id).textContent=t(key);
      $('week').textContent=format(t('weekValue'),week);$('cash').textContent=format(t('cashValue'),balance.toLocaleString('en-US'));$('task').textContent=format(t('taskValue'),decision?0:1);$('count').textContent=format(t('count'),list().length);
      $('messages').innerHTML=list().map(m=>`<button type="button" class="message${m.id===selected?' selected':''}" data-message="${m.id}" ${m.id===selected?'aria-current="true"':''}><span class="message-head"><strong>${escapeHtml(m.sender)}</strong><span class="badge ${m.state==='complete'?'done':m.state==='notice'?'info':''}">${escapeHtml(t(m.state))}</span></span><span class="subject">${escapeHtml(m.subject)}</span><span class="preview">${escapeHtml(m.preview)}</span></button>`).join('');
      const m=list().find(x=>x.id===selected)||list()[0];let body='';
      if(selected==='training'){
        body=facts([[t('price'),format(t('cashValue'),'2,000')],[t('trust'),format(t('trustValue'),trust)],[t('time'),t('deadline')]])+(decision?`<h3 class="choice-head">${escapeHtml(t('result'))}</h3><p class="receipt">${escapeHtml(t(decision==='pay'?'paid':'declined'))}</p>`:`<h3 class="choice-head">${escapeHtml(t('actions'))}</h3><button class="choice primary" type="button" data-choice="pay"><strong>${escapeHtml(t('pay'))}</strong><small>${escapeHtml(t('payDetail'))}</small></button><button class="choice" type="button" data-choice="wait"><strong>${escapeHtml(t('wait'))}</strong><small>${escapeHtml(t('waitDetail'))}</small></button>`);
      } else if(selected==='scout')body=facts([[t('newsA'),t('newsAV')],[t('newsB'),t('newsBV')],[t('newsC'),t('newsCV')]]);
      else if(selected==='finance')body=facts([[t('financeA'),t('financeAV')],[t('financeB'),t('financeBV')],[t('financeC'),t('financeCV')]]);
      else body=facts([[t('nextFact'),t('nextFactValue')],[t('nextLabel'),t('nextLabelValue')]]);
      const lead=selected==='training'?t('lead'):selected==='scout'?t('newsLead'):selected==='finance'?t('financeLead'):t('nextLead');
      $('detail').innerHTML=`<button type="button" class="back" data-back>${escapeHtml(t('back'))}</button><p class="sender">${escapeHtml(m.sender)}</p><h2 id="detailTitle" tabindex="-1">${escapeHtml(m.subject)}</h2><p class="lead">${escapeHtml(lead)}</p>${body}`;
      $('footerHint').textContent=t(advanced?'nextHint':decision?'hintReady':'hintPending');$('advance').disabled=!decision||advanced;
    }
    $('messages').addEventListener('click',e=>{const b=e.target.closest('[data-message]');if(!b)return;selected=b.dataset.message;$('app').classList.add('show-detail');render();$('detailTitle').focus({preventScroll:true});});
    $('detail').addEventListener('click',e=>{if(e.target.closest('[data-back]')){$('app').classList.remove('show-detail');$('messages').querySelector(`[data-message="${selected}"]`)?.focus();return;}const b=e.target.closest('[data-choice]');if(!b||decision)return;decision=b.dataset.choice;if(decision==='pay'){balance-=2000;trust+=4;}render();$('announcement').textContent=t(decision==='pay'?'paid':'declined');});
    $('advance').addEventListener('click',()=>{if(!decision||advanced)return;week++;advanced=true;selected='followup';$('app').classList.add('show-detail');render();$('announcement').textContent=t('advanced');$('detailTitle').focus({preventScroll:true});});
    $('reset').addEventListener('click',()=>{selected='training';decision=null;week=1;balance=150000;trust=72;advanced=false;$('app').classList.remove('show-detail');render();$('announcement').textContent=t('inbox');});
    $('language').addEventListener('click',()=>{language=language==='zh'?'en':'zh';render();});render();
  })();
  </script>
</body>
</html>
